[build-system]
requires = ["setuptools>=61.3.1", "setuptools-scm>=8.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tplink-vx800v-exporter"
dynamic = ["version"]
description = "Prometheus exporter for TP-Link VX800v (Aginet) routers"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Luca Becker" }
]
dependencies = [
    "prometheus-client>=0.21.0",
    "tplinkrouterc6u>=5.0.0",
]

[project.scripts]
tplink-vx800v-exporter = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "config",
    "metrics",
    "collector",
    "auth",
    "router",
    "parsers",
    "logging_utils",
    "version",
]

[tool.setuptools_scm]
# Dynamic versioning from git tags

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"router.py" = ["E501", "UP031", "SIM105"]
"auth.py" = ["E501", "UP031", "SIM108"]
"parsers.py" = ["E501"]
"metrics.py" = ["E501"]
"scripts/*" = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
